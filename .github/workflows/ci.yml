name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS too: its awk is a target of its own (UTF-8 aware, unlike mawk and
    # BusyBox, and not gawk), and some reader bugs exist only there.
    # Both legs' results are the point — a macOS-leg failure must not cancel the
    # ubuntu leg (or the reverse); that hides exactly the cross-OS divergence
    # the matrix exists to observe.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: shellcheck (every tracked shell script)
        if: runner.os == 'Linux'
        run: git ls-files -z -- '*.sh' | xargs -0 -r shellcheck -S warning
      - run: npm run typecheck
      # Formatting is enforced by a local hook, so CI is its backstop: hooks are
      # skippable (--no-verify, a fresh clone before setup) and CI is not.
      - run: npm run format:check
      - run: npm test
      - run: npm run build
