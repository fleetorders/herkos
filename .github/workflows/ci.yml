name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Formatting is enforced by a local hook, so CI is its backstop: hooks are
      # skippable (--no-verify, a fresh clone before setup) and CI is not.
      - run: npm run format:check
      - run: npm test
      - run: npm run build
