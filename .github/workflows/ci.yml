name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS too: its awk is a target of its own (UTF-8 aware, unlike mawk and
    # BusyBox, and not gawk), and some reader bugs exist only there.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Formatting is enforced by a local hook, so CI is its backstop: hooks are
      # skippable (--no-verify, a fresh clone before setup) and CI is not.
      - run: npm run format:check
      - run: npm test
      - run: npm run build
